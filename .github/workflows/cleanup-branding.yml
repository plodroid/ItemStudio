name: Cleanup ItemStudio branding

on:
  push:
    paths:
      - '.github/workflows/cleanup-branding.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove farted.net branding
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'ItemStudio<span>.farted.net</span>': 'ItemStudio',
              'ItemStudio.farted.net': 'ItemStudio',
              '.farted.net': '',
              'farted.net': '',
          }

          changed = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('Changed:', ', '.join(changed) if changed else 'nothing')
          PY
      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo "Nothing to change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html checker.html
          git commit -m "Remove old farted.net branding"
          git push
